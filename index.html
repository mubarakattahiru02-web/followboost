<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FollowBoost</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">FollowBoost</div>
      <div class="badge">V1</div>
    </header>

    <section class="hero">
      <h1>Grow your social presence.</h1>
      <p>Complete tasks, earn points, and connect with real people across social platforms.</p>
    </section>

    <section class="card points">
      <span>Your Points</span>
      <strong id="points">0</strong>
      <button id="checkin">Daily Check-in +10</button>
    </section>

    <section class="grid">
      <button class="tile" onclick="show('Tasks')"><b>Tasks</b><small>Earn points</small></button>
      <button class="tile" onclick="show('Wallet')"><b>Wallet</b><small>Points balance</small></button>
      <button class="tile" onclick="show('Referrals')"><b>Referrals</b><small>Invite friends</small></button>
      <button class="tile" onclick="show('Buy Points')"><b>Buy Points</b><small>More points</small></button>
    </section>

    <section class="card auth">
      <h2>Create account</h2>
      <input id="name" placeholder="Full name">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="signup">Sign up</button>
      <p id="msg"></p>
    </section>

    <section id="panel" class="card hidden"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
